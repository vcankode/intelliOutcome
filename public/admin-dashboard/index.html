<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IntelliOutcome · Admin Dashboard</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="Banasthali Vidyapith logo" width="40" height="40">
      <div>Banasthali Vidyapith<small>IntelliOutcome · Admin</small></div>
    </div>
    <div class="user-chip">
      <span class="session-tag">Session 2026-27</span>
      <span class="avatar" aria-hidden="true">A</span>
      <span>Administrator</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav" aria-label="Admin navigation">
        <a href="#/overview" data-nav="overview">Overview</a>
        <a href="#/programs" data-nav="programs">Programs &amp; Branches</a>
        <a href="#/faculty" data-nav="faculty">Faculty Accounts</a>
        <a href="#/courses" data-nav="courses">Courses &amp; Allocation <span class="count" id="nav-conflicts" hidden></span></a>
        <a href="#/compliance" data-nav="compliance">Compliance <span class="count" id="nav-overdue" hidden></span></a>
        <a href="#/audit" data-nav="audit">Audit Log</a>
      </nav>
    </aside>
    <main class="main" id="view"></main>
  </div>

  <div id="modal-root"></div>

  <div id="session-overlay" class="overlay" hidden>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="sess-title">
      <div class="modal-body">
        <h2 id="sess-title" style="margin:0 0 8px;color:#1d264d;font-size:17px">Session timed out</h2>
        <p class="muted" style="margin:0 0 16px">You were inactive for 15 minutes, so the session was locked for security.</p>
        <button class="btn" id="session-continue" type="button">Continue session</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
